plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Flutter forwards --dart-define values to Gradle as a base64 encoded, comma
// separated "dart-defines" property, so one flag can supply the API key to
// both the Dart code and the Android manifest.
def dartDefines = [:]
if (project.hasProperty("dart-defines")) {
    dartDefines = project.property("dart-defines")
            .split(",")
            .collectEntries { entry ->
                def pair = new String(entry.decodeBase64(), "UTF-8").split("=", 2)
                pair.length == 2 ? [(pair[0]): pair[1]] : [:]
            }
}

android {
    namespace = "com.example.google_maps_widget_demo"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.google_maps_widget_demo"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Substituted into com.google.android.geo.API_KEY in AndroidManifest.xml.
        manifestPlaceholders += [
            GOOGLE_MAPS_API_KEY: dartDefines["GOOGLE_MAPS_API_KEY"] ?: "PASTE_GOOGLE_MAPS_API_KEY_HERE"
        ]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
